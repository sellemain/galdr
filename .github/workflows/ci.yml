name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install and sync dependencies
        run: |
          python -m pip install uv
          uv sync --extra dev --frozen

      - name: Check lint and formatting
        run: |
          uv run ruff check src/galdr tests
          uv run ruff format --check src/galdr tests

      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file requirements-audit.txt
          uv run pip-audit --requirement requirements-audit.txt --no-deps --disable-pip

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --verbose /repo

      - name: Scan dependencies and configuration
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -v trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
            --scanners vuln,misconfig,secret /repo

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build image
        run: docker build --tag galdr:test .

      - name: Verify locked dependencies, CLI, and mounted output ownership
        run: |
          expected_yt_dlp="$(awk '/^name = "yt-dlp"$/{found=1; next} found && /^version = /{gsub(/[" ]/, "", $3); print $3; exit}' uv.lock)"
          actual_yt_dlp="$(docker run --rm --entrypoint python galdr:test -c 'from importlib.metadata import version; print(version("yt-dlp"))')"
          test "$actual_yt_dlp" = "$expected_yt_dlp"
          mkdir -p "$RUNNER_TEMP/galdr-work/audio"
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint ffmpeg \
            -v "$RUNNER_TEMP/galdr-work:/work" \
            galdr:test -f lavfi -i "sine=frequency=440:duration=1" /work/audio/smoke.wav
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/galdr-work:/work" \
            galdr:test listen audio/smoke.wav --name smoke --only report --no-catalog
          test -f "$RUNNER_TEMP/galdr-work/analysis/smoke/galdr-complete.json"
          test "$(stat -c %u "$RUNNER_TEMP/galdr-work/analysis/smoke/galdr-complete.json")" = "$(id -u)"

      - name: Scan built image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --exit-code 1 --ignore-unfixed --severity MEDIUM,HIGH,CRITICAL galdr:test

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install package with dev dependencies
        run: |
          python -m pip install uv
          uv sync --extra dev --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: uv run pytest --cov=galdr --cov-report=xml -q

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
